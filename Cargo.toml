[package]
name = "siren_dispatch"
version = "0.1.0"
edition = "2021"

[dependencies]
teloxide = { version = "0.12", features = ["macros"] }
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
sysinfo = "0.30"
log = "0.4"
pretty_env_logger = "0.5"

# Compiler optimization settings to prevent RAM crash and timeout
[profile.release]
opt-level = 2
lto = false
codegen-units = 4
strip = true
